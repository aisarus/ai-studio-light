<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dual Audio Local</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b0d10;color:#fff;margin:0;padding:18px}main{max-width:760px;margin:auto}h1{font-size:42px;letter-spacing:-.04em}.card{background:#15191f;border:1px solid #2d343e;border-radius:18px;padding:16px;margin:12px 0}button,label{display:block;width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:17px;background:#f3f5f7;color:#111;text-align:center}.file input{display:none}.muted{color:#a5afbb;line-height:1.45}.ok{color:#8ff0be}.bad{color:#ff8585}video{width:100%;max-height:48vh;background:#000;border-radius:14px;margin-top:12px}input[type=range]{width:100%}</style></head><body><main><h1>Dual Audio Local</h1><div class="muted">iPad + Bose = фильм. Телефон + Sony = второй звук. Интернет не нужен — страница пришла прямо с телефона.</div><div class="card"><b>1. Выбери фильм</b><label class="file" style="margin-top:12px">ВЫБРАТЬ ФИЛЬМ<input id="file" type="file" accept="video/*,.mp4,.mov,.m4v"></label><div id="name" class="muted" style="margin-top:8px">Файл не выбран</div><video id="movie" controls playsinline></video></div><div class="card"><b>2. Подключи второй звук</b><button id="connect" style="margin-top:12px" disabled>CONNECT SONY</button><div id="status" class="muted" style="margin-top:10px">Жду фильм</div></div><div class="card"><b>3. Синхронизация</b><div class="muted">Если Bose на iPad звучат раньше Sony на телефоне — увеличивай задержку.</div><div style="display:flex;justify-content:space-between;margin-top:14px"><span>Задержка Bose</span><b id="delayV">250 ms</b></div><input id="delay" type="range" min="0" max="1500" value="250" step="10"></div></main><script>(()=>{const $=id=>document.getElementById(id);let url,ctx,src,delay,proc,zero,ws;$('file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);$('movie').src=url;$('name').textContent=f.name;$('connect').disabled=false;$('status').textContent='Фильм выбран. Нажми CONNECT SONY';};async function start(){try{if(ws)try{ws.close()}catch{};ws=new WebSocket('ws://'+location.hostname+':8081');ws.binaryType='arraybuffer';$('status').textContent='Подключаюсь к телефону…';ws.onopen=async()=>{const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC({latencyHint:'interactive'});await ctx.resume();src=ctx.createMediaElementSource($('movie'));delay=ctx.createDelay(2);delay.delayTime.value=Number($('delay').value)/1000;src.connect(delay);delay.connect(ctx.destination);proc=ctx.createScriptProcessor(2048,2,2);zero=ctx.createGain();zero.gain.value=0;src.connect(proc);proc.connect(zero);zero.connect(ctx.destination);ws.send('config:'+Math.round(ctx.sampleRate)+',2');proc.onaudioprocess=ev=>{if(ws.readyState!==1)return;const n=ev.inputBuffer.length,l=ev.inputBuffer.getChannelData(0),r=ev.inputBuffer.numberOfChannels>1?ev.inputBuffer.getChannelData(1):l;const out=new Int16Array(n*2);for(let i=0,j=0;i<n;i++){let a=Math.max(-1,Math.min(1,l[i])),b=Math.max(-1,Math.min(1,r[i]));out[j++]=a<0?a*32768:a*32767;out[j++]=b<0?b*32768:b*32767;}ws.send(out.buffer);};$('status').innerHTML='<span class="ok">Телефон подключён ✓ Запускай фильм</span>';};ws.onerror=()=>{$('status').innerHTML='<span class="bad">Не вижу телефон. Проверь hotspot и открой страницу по QR заново.</span>';};ws.onclose=()=>{$('status').textContent='Связь закрыта';};}catch(e){$('status').innerHTML='<span class="bad">'+e.message+'</span>';}}$('connect').onclick=start;$('delay').oninput=e=>{const ms=Number(e.target.value);$('delayV').textContent=ms+' ms';if(delay&&ctx)delay.delayTime.setTargetAtTime(ms/1000,ctx.currentTime,.02);};})();</script></body></html>
